name: Publish Docker image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Always refresh base images and execute both stages' package upgrades.
          pull: true
          no-cache-filters: builder,runner
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pogo-meetups:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pogo-meetups:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pogo-meetups:buildcache,mode=max
