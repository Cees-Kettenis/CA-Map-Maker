name: Remove accidentally public CI package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the package created by the initial migration run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          endpoint = 'https://api.github.com/users/Cees-Kettenis/packages/container/pogo-meetups'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urlopen(Request(endpoint, headers=headers), timeout=30) as response:
              package = json.load(response)
          if package['created_at'] != '2026-10-06T06:57:58Z' or package['visibility'] != 'public' or package['repository']['full_name'] != 'Cees-Kettenis/CA-Map-Maker':
              raise SystemExit('Package does not match the accidental upload; refusing deletion')
          with urlopen(Request(endpoint, headers=headers, method='DELETE'), timeout=30) as response:
              print('Accidentally public migration package removed:', response.status)
          PY
